# Copy this file and content.toml to ~/.config/seqviz-rs/.
# When XDG_CONFIG_HOME is set, use $XDG_CONFIG_HOME/seqviz-rs/ instead.
# All fields are optional; omitted fields retain the built-in default.

[display]
show_quality = true

[vcf]
pass_color = "#7ed397"
filter_color = "#f0c674"
missing_color = "#8f9bb3"
# ALT1, ALT2, ... use these colours in both GT and AD; REF keeps the foreground.
allele_colors = ["#7ab7ff", "#be9bf3", "#78d5d4", "#f0c674", "#f18594"]
show_ad_bars = true
detail_rows = 10

[theme]
# Relative paths are resolved against this configuration file's directory.
content = "content.toml"
background = "#181b23"
foreground = "#e0e5ef"
muted = "#8f9bb3"
border = "#47546e"
focus = "#7ab7ff"
selection = "#3e4d6c"
