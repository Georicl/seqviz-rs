# Yazi 26.9 and later.
[opener]
sq = [
  { run = 'sq -- %s', block = true, desc = "Sequence and variant browser", for = "unix" },
]

[open]
prepend_rules = [
  { url = "*.{fa,fasta,fna,fas,fsa,faa,pep,fq,fastq,sam,bam,vcf}", use = "sq" },
  { url = "*.{fa,fasta,fna,fas,fsa,faa,pep,fq,fastq,sam,vcf}.{gz,bgz,bgzf}", use = "sq" },
]
