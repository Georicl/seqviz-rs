# Yazi 25.4: merge these entries into ~/.config/yazi/yazi.toml.
[opener]
sq = [
  { run = 'sq -- "$@"', block = true, desc = "Sequence browser", for = "unix" },
]

[open]
prepend_rules = [
  { name = "*.{fa,fasta,fna,fas,fsa,faa,pep,fq,fastq,sam,bam}", use = "sq" },
  { name = "*.{fa,fasta,fna,fas,fsa,faa,pep,fq,fastq,sam}.{gz,bgz,bgzf}", use = "sq" },
]
